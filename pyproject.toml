[project]
name = "jafne"
version = "0.1.0"
description = "Jarvis Assistant For N→ Software Engineering — núcleo y panel web"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Dictado por voz del panel (ADR-0036). Opcional a propósito: JAFNE corre entero sin esto,
# y son varios cientos de MB de motor más el modelo. Sin el extra, el botón se muestra
# deshabilitado con el motivo en vez de fallar al apretarlo.
voz = [
    "faster-whisper>=1.0",
]

[project.scripts]
jafne = "jafne.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jafne.panel" = ["web/*"]
"jafne.nucleo.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
